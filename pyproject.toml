[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patch-composition"
version = "0.1.0"
description = "Study of plasma composition in solar wind switchback patches"
requires-python = ">=3.12"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "xarray",
    "netCDF4",
    "astropy",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["src"]
